{% extends 'base.html' %}
{% block content %}
<h1>Search by Song</h1>
<form method="post">
  <input type="text" name="query" placeholder="Song name">
  <button type="submit">Search</button>
</form>
{% if results %}
<ul>
  {% for r in results %}
  <li>{{ r.title }}<br>
    <video width="320" controls>
      <source src="{{ r.url }}">
    </video>
  </li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
