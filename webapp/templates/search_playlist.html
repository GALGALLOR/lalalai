{% extends 'base.html' %}
{% block content %}
<h1>Search Playlist</h1>
<form method="get">
    <input type="text" name="q" placeholder="Enter search" value="{{ request.args.get('q', '') }}">
    <button type="submit">Search</button>
</form>
<ul>
{% for item in results %}
    <li>{{ item.title }} - {{ item.uploader }}<br>
        <video src="{{ item.playlist_url }}" controls></video>
    </li>
{% endfor %}
</ul>
{% endblock %}
